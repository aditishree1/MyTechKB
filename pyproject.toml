[project]
name = "mytechkb"
version = "0.1.0"
description = "Personal RAG knowledge base — YouTube playlists, articles, PDFs, images. Ask questions with citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.23",
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "langchain-core>=0.3.28",
    "langchain-ollama>=0.2.2",
    "langchain-text-splitters>=0.3.4",
    "pillow>=11.0.0",
    "pydantic-settings>=2.7.0",
    "pymupdf>=1.25.1",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "readability-lxml>=0.8.1",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.34.0",
    "youtube-transcript-api>=1.0.3",
]

[project.scripts]
mytechkb = "mytechkb:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
